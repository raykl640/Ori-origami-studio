# CI for ORI: on every push and pull request, build on Linux, macOS and
# Windows (the SDL2 studio on Linux and macOS), run the unit tests, render
# every evidence sheet plus studio screenshots, and upload the images.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 (studio window; Windows builds without the studio)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install sdl2; fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Render evidence sheets and fold the sample sequences
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./build/ori --out output
          for f in patterns/*.ori; do ./build/ori fold "$f" --out output/folds; done
          for f in patterns/*.cp; do ./build/ori render "$f" "output/folds/$(basename "$f" .cp).png"; done
          ./build/ori_studio --screenshot output/studio_fold.png
          ./build/ori_studio --screenshot output/studio_crease.png patterns/preliminary_base.cp

      - name: Upload renders
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ori-renders
          path: output/
